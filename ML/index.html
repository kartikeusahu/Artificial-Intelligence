<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Price Prediction</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
      width: 380px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      font-weight: bold;
      color: #555;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5361d6;
    }

    #res {
      margin-top: 25px;
      text-align: center;
      font-size: 24px;
      color: #222;
      background: #f1f3ff;
      padding: 15px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>🏠 House Price Prediction</h2>

    <label>Area in Sqft</label>
    <input type="number" id="Area_sqft" placeholder="Enter area">

    <label>Bedrooms</label>
    <input type="number" id="Bedrooms" placeholder="Enter bedrooms">

    <label>House Age</label>
    <input type="number" id="Age_years" placeholder="Enter age in years">

    <button onclick="predict()">Predict Price</button>

    <h1 id="res"></h1>
  </div>

  <script>
    async function predict() {
      let Area_sqft = document.getElementById("Area_sqft").value;
      let Bedrooms = document.getElementById("Bedrooms").value;
      let Age_years = document.getElementById("Age_years").value;
      let res = document.getElementById("res");

      if (Area_sqft === "" || Bedrooms === "" || Age_years === "") {
        res.style.display = "block";
        res.innerHTML = "Please fill all fields";
        return;
      }

      try {
        let result = await fetch("http://127.0.0.1:8000/predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            Area_sqft: parseFloat(Area_sqft),
            Bedrooms: parseInt(Bedrooms),
            Age_years: parseInt(Age_years)
          })
        });

        let data = await result.json();

        res.style.display = "block";
        res.innerHTML = "₹ " + data.predicted_price.toLocaleString();

      } catch (error) {
        res.style.display = "block";
        res.innerHTML = "Server not connected";
      }
    }
  </script>

</body>
</html>
